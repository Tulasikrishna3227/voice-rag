services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./data:/srv/data
      - hf_cache:/srv/.cache/hf
  ui:
    build: .
    command: streamlit run ui.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - API_URL=http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  hf_cache:
